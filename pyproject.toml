[project]
name = "helpdesk_sync"
authors = [
    { name = "David Nienhaus", email = "info@example.com" }
]
description = "Sync ERPNext Customer -> Helpdesk HD Customer"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
